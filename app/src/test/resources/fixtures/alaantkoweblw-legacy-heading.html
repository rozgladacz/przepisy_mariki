<body>
<h1>Cukiniowe penne z sosem beszamelowym</h1>
<div class="main-content-container wysiwyg-content">
  <div class="container wysiwyg-content">
    <p>Składniki:<br>250 g makaronu penne<br>1 cukinia<br>1 cebula<br>2 łyżki oliwy<br>100 g sera</p>
    <p>Sos beszamelowy:</p>
    <p>Makaron ugotuj zgodnie z instrukcją. Cukinię pokrój, podsmaż z cebulą i połącz z makaronem oraz sosem.</p>
    <p>Przełóż całość do naczynia i piecz przez 20 minut.</p>
  </div>
</div>
</body>
</html>
