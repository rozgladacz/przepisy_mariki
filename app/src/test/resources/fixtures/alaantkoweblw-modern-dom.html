<header><h1>Bananowe pączki testowe</h1></header>
<section>
    <div>
        <h2 class="section__title">Bananowe pączki testowe</h2>
        <div class="wysiwyg-content"><h2>Pełny opis nowego układu przepisu.</h2></div>
    </div>
</section>
<section class="section recipe">
    <div><h3>Składniki:</h3></div>
    <div class="recipe__ingredients">
        <div class="recipe__ingredients-item">1 dojrzały banan</div>
        <div class="recipe__ingredients-item">¾ szklanki mąki pszennej</div>
        <div class="recipe__ingredients-item">½ łyżeczki proszku do pieczenia</div>
    </div>
    <div><h3>Wykonanie:</h3></div>
    <div class="wysiwyg-content">
        <p>Banana rozgnieć i wymieszaj z mąką.</p>
        <p>Piecz przez 10 minut.</p>
    </div>
</section>
